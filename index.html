<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masood Korejo - Typing Test</title>
<meta name="description" content="Masood Korejo ka typing test: apna lesson lagayein, waqt set karein aur WPM speed dekhein.">
<style>
:root{--bg:#f3f1ec;--surface:#fffdf8;--ink:#1d2b2a;--muted:#6b7775;--accent:#0e6b66;--ok:#0e6b66;--bad:#b3261e;--bad-bg:#f6d9d6;--line:#d8d4c8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13201f;--surface:#1b2b2a;--ink:#e8efee;--muted:#9bb0ad;--accent:#5fd0c6;--ok:#5fd0c6;--bad:#ff8a80;--bad-bg:#4a2523;--line:#2f4442}}
:root[data-theme="dark"]{--bg:#13201f;--surface:#1b2b2a;--ink:#e8efee;--muted:#9bb0ad;--accent:#5fd0c6;--ok:#5fd0c6;--bad:#ff8a80;--bad-bg:#4a2523;--line:#2f4442}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Noto Serif",serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
.name{font-size:clamp(2rem,8vw,3.4rem);font-weight:700;letter-spacing:-.02em;border:0;background:transparent;color:var(--ink);width:100%;font-family:inherit;padding:4px 0;border-bottom:2px dashed var(--line)}
.name:focus{outline:none;border-bottom-color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 20px;font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-size:clamp(1.6rem,7vw,2.4rem);font-variant-numeric:tabular-nums;color:var(--accent)}
.stat span{color:var(--muted);font-size:.85rem}
.text{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;font-size:1.3rem;line-height:1.9;min-height:120px;max-height:260px;overflow-y:auto;user-select:none;word-break:break-word}
.text span.ok{color:var(--ok)}
.text span.bad{color:var(--bad);background:var(--bad-bg);border-radius:3px}
.text span.cur{border-left:2px solid var(--accent);margin-left:-2px}
textarea,input[type=number]{font-family:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
textarea:focus,input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#typing{margin-top:12px;min-height:90px;font-size:1.1rem}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;align-items:end}
.row label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.row .t{width:110px}
button{font-family:inherit;font-size:1rem;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);padding:10px 18px;cursor:pointer}
button.alt{background:transparent;color:var(--accent)}
details{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
summary{cursor:pointer;font-weight:700}
details textarea{margin-top:10px;min-height:120px}
#result{margin-top:14px;font-weight:700;color:var(--accent)}
</style>
</head>
<body>
<main>
<input class="name" id="name" value="Masood Korejo" maxlength="40" aria-label="Aapka naam">
<p class="sub">Typing Test — apna lesson aur waqt neeche se badal sakte hain.</p>

<div class="stats">
<div class="stat"><b id="wpm">0</b><span>WPM</span></div>
<div class="stat"><b id="left">60</b><span>Baqi waqt (sec)</span></div>
<div class="stat"><b id="acc">100%</b><span>Accuracy</span></div>
</div>

<div class="text" id="text"></div>
<textarea id="typing" placeholder="Yahan typing shuru karein…" aria-label="Typing area"></textarea>
<div id="result"></div>

<div class="row">
<div><label for="secs">Waqt (seconds)</label><input class="t" type="number" id="secs" value="60" min="5" max="3600"></div>
<button id="restart">Dobara shuru</button>
</div>

<details open>
<summary>Apna lesson lagayein</summary>
<textarea id="lesson" aria-label="Lesson text"></textarea>
<div class="row"><button class="alt" id="apply">Lesson save karein</button></div>
</details>
</main>
<script>
(function(){
var DEFAULT="Practice karne se typing speed behtar hoti hai. Har roz thori der likhein, ghalti kam karein aur ungliyon ko keyboard par sahi jagah rakhein.";
var $=function(i){return document.getElementById(i)};
var textEl=$("text"),typing=$("typing"),lesson="",timer=null,start=0,total=60,running=false,done=false;
function load(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
$("name").value=load("tt_name","Masood Korejo");
lesson=load("tt_lesson",DEFAULT);
total=parseInt(load("tt_secs","60"),10)||60;
$("secs").value=total;$("lesson").value=lesson;$("left").textContent=total;
$("name").addEventListener("input",function(){save("tt_name",this.value)});
function render(){
var t=typing.value,h="";
for(var i=0;i<lesson.length;i++){
var c=lesson[i].replace(/&/g,"&amp;").replace(/</g,"&lt;");
var cls=i<t.length?(t[i]===lesson[i]?"ok":"bad"):(i===t.length?"cur":"");
h+='<span class="'+cls+'">'+c+'</span>';
}
textEl.innerHTML=h;
var cur=textEl.querySelector(".cur");
if(cur){var top=cur.offsetTop-textEl.offsetTop;if(top>textEl.clientHeight-60||top<0)textEl.scrollTop=Math.max(0,top-40)}
}
function stats(){
var t=typing.value,ok=0;
for(var i=0;i<t.length;i++)if(t[i]===lesson[i])ok++;
var mins=Math.max((Date.now()-start)/60000,1/600);
$("wpm").textContent=running||done?Math.round((ok/5)/mins):0;
$("acc").textContent=t.length?Math.round(ok/t.length*100)+"%":"100%";
}
function finish(){
clearInterval(timer);running=false;done=true;typing.disabled=true;stats();
$("result").textContent=$("name").value+", aapki speed: "+$("wpm").textContent+" WPM, accuracy "+$("acc").textContent+".";
}
function tick(){
var left=Math.max(0,total-Math.floor((Date.now()-start)/1000));
$("left").textContent=left;stats();
if(left<=0)finish();
}
function reset(){
clearInterval(timer);running=false;done=false;
var s=parseInt($("secs").value,10);
total=s>=5?Math.min(s,3600):60;$("secs").value=total;save("tt_secs",total);
typing.disabled=false;typing.value="";
$("wpm").textContent=0;$("acc").textContent="100%";$("left").textContent=total;$("result").textContent="";
render();typing.focus();
}
typing.addEventListener("input",function(){
if(done)return;
if(!running){running=true;start=Date.now();timer=setInterval(tick,250)}
render();stats();
if(typing.value.length>=lesson.length)finish();
});
$("restart").addEventListener("click",reset);
$("secs").addEventListener("change",reset);
$("apply").addEventListener("click",function(){
var v=$("lesson").value.replace(/\s+/g," ").trim();
if(!v){$("lesson").focus();return}
lesson=v;save("tt_lesson",v);reset();
});
render();
})();
</script>
</body>
</html>
